<!doctype html>

		<title>LPQ Al-Muhajirun Metode Qiroati Baturaja</title>
		<link rel="preload" as="image" href="/logo.png" />
		<style>
			/* Inline loading screen — renders instantly before any JS or CSS bundle */
			#lpq-loading {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: #0c1220;
				transition: opacity 0.4s ease, transform 0.4s ease;
			}
			#lpq-loading.lpq-loading-hide {
				opacity: 0;
				transform: scale(1.02);
				pointer-events: none;
			}
			#lpq-loading::before {
				content: '';
				position: absolute;
				inset: 0;
				background: radial-gradient(ellipse 60% 50% at 50% 45%, rgba(16, 185, 129, 0.10) 0%, rgba(6, 182, 212, 0.07) 40%, rgba(139, 92, 246, 0.05) 70%, transparent 100%);
				pointer-events: none;
			}
			.lpq-loading-logo-wrap {
				position: relative;
				width: 96px;
				height: 96px;
				margin-bottom: 1.5rem;
			}
			.lpq-loading-glow {
				position: absolute;
				inset: -12px;
				border-radius: 50%;
				background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(6, 182, 212, 0.12) 50%, transparent 75%);
				animation: lpq-pulse 2.4s ease-in-out infinite;
				pointer-events: none;
			}
			.lpq-loading-ring {
				position: absolute;
				inset: -4px;
				border-radius: 50%;
				border: 1.5px solid rgba(255, 255, 255, 0.08);
				pointer-events: none;
			}
			#lpq-loading img {
				position: relative;
				width: 96px;
				height: 96px;
				object-fit: contain;
				border-radius: 50%;
				z-index: 1;
				animation: lpq-logo-breathe 2.4s ease-in-out infinite;
			}
			.lpq-loading-text {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				font-size: 1.15rem;
				font-weight: 600;
				color: rgba(255, 255, 255, 0.92);
				letter-spacing: 0.02em;
				margin-bottom: 0.35rem;
				animation: lpq-text-pulse 2.4s ease-in-out 0.15s infinite;
			}
			.lpq-loading-subtitle {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				font-size: 0.8rem;
				color: rgba(255, 255, 255, 0.45);
				letter-spacing: 0.06em;
				text-transform: uppercase;
				margin-bottom: 1.25rem;
				animation: lpq-text-pulse 2.4s ease-in-out 0.3s infinite;
			}
			.lpq-loading-progress {
				width: 120px;
				height: 2px;
				background: rgba(255, 255, 255, 0.06);
				border-radius: 2px;
				overflow: hidden;
			}
			.lpq-loading-progress-bar {
				width: 40%;
				height: 100%;
				background: linear-gradient(90deg, rgba(16, 185, 129, 0.6), rgba(6, 182, 212, 0.6));
				border-radius: 2px;
				animation: lpq-progress-slide 1.6s ease-in-out infinite;
			}
			@keyframes lpq-pulse {
				0%, 100% { opacity: 0.6; transform: scale(1); }
				50% { opacity: 1; transform: scale(1.06); }
			}
			@keyframes lpq-logo-breathe {
				0%, 100% { opacity: 0.85; transform: scale(1); }
				50% { opacity: 1; transform: scale(1.04); }
			}
			@keyframes lpq-text-pulse {
				0%, 100% { opacity: 0.7; }
				50% { opacity: 1; }
			}
			@keyframes lpq-progress-slide {
				0% { transform: translateX(-100%); }
				100% { transform: translateX(350%); }
			}
			@media (prefers-reduced-motion: reduce) {
				#lpq-loading::before,
				.lpq-loading-glow,
				#lpq-loading img,
				.lpq-loading-text,
				.lpq-loading-subtitle,
				.lpq-loading-progress-bar {
					animation: none !important;
				}
				#lpq-loading img {
					opacity: 1;
					transform: none;
				}
				.lpq-loading-text,
				.lpq-loading-subtitle {
					opacity: 0.85;
				}
			}
		</style>
	</head>
	<body>
		<!-- Inline loading shell — visible before React hydrates -->
		<div id="lpq-loading">
			<div class="lpq-loading-logo-wrap">
				<div class="lpq-loading-glow"></div>
				<div class="lpq-loading-ring"></div>
				<img src="/logo.png" alt="Logo LPQ Al-Muhajirun" width="96" height="96" loading="eager" fetchpriority="high" decoding="sync" />
			</div>
			<div class="lpq-loading-text">LPQ Al-Muhajirun</div>
			<div class="lpq-loading-subtitle">Metode Qiroati</div>
			<div class="lpq-loading-progress">
				<div class="lpq-loading-progress-bar"></div>
			</div>
		</div>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
