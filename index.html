<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<meta name="generator" content="Vite" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>LPQ Al-Muhajirun Metode Qiroati Baturaja</title>
		<link rel="preload" href="https://fonts.gstatic.com/s/cinzel/v23/8vIU7ww63mVu7gtR-kwKxNvkNOjw-tbnTYrvDE5ZdqU.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			/* Inline loading screen — renders instantly before any JS or CSS bundle */
			#lpq-loading {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: #0c1220;
				transition: opacity 0.4s ease, transform 0.4s ease;
			}
			#lpq-loading.lpq-loading-hide {
				opacity: 0;
				transform: scale(1.02);
				pointer-events: none;
			}
			#lpq-loading::before {
				content: '';
				position: absolute;
				inset: 0;
				background: radial-gradient(ellipse 60% 50% at 50% 45%, rgba(6, 182, 212, 0.12) 0%, rgba(139, 92, 246, 0.08) 40%, rgba(16, 185, 129, 0.04) 70%, transparent 100%);
				pointer-events: none;
			}
			.lpq-loading-ring {
				position: relative;
				width: 3rem;
				height: 3rem;
				margin-bottom: 1.25rem;
			}
			.lpq-loading-ring > span {
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 3px solid transparent;
				animation: lpq-ring-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
			}
			.lpq-loading-ring > span:nth-child(1) {
				border-top-color: rgba(6, 182, 212, 0.8);
				animation-delay: 0s;
			}
			.lpq-loading-ring > span:nth-child(2) {
				inset: 5px;
				border-top-color: rgba(139, 92, 246, 0.6);
				animation-delay: -0.15s;
			}
			.lpq-loading-text {
				font-family: 'Cinzel', serif;
				font-size: 1.5rem;
				font-weight: 700;
				color: rgba(255, 255, 255, 0.92);
				letter-spacing: 0.04em;
				margin-bottom: 0.35rem;
				animation: lpq-text-pulse 2.4s ease-in-out 0.15s infinite;
			}
			.lpq-loading-subtitle {
				font-family: 'Cinzel', serif;
				font-size: 0.75rem;
				font-weight: 700;
				color: rgba(255, 255, 255, 0.45);
				letter-spacing: 0.08em;
				text-transform: uppercase;
				margin-bottom: 1.25rem;
				animation: lpq-text-pulse 2.4s ease-in-out 0.3s infinite;
			}
			.lpq-loading-progress {
				width: 120px;
				height: 2px;
				background: rgba(255, 255, 255, 0.06);
				border-radius: 2px;
				overflow: hidden;
			}
			.lpq-loading-progress-bar {
				width: 40%;
				height: 100%;
				background: linear-gradient(90deg, rgba(6, 182, 212, 0.7), rgba(139, 92, 246, 0.7));
				border-radius: 2px;
				animation: lpq-progress-slide 1.6s ease-in-out infinite;
			}
			@keyframes lpq-ring-spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}
			@keyframes lpq-text-pulse {
				0%, 100% { opacity: 0.7; }
				50% { opacity: 1; }
			}
			@keyframes lpq-progress-slide {
				0% { transform: translateX(-100%); }
				100% { transform: translateX(350%); }
			}
			@media (prefers-reduced-motion: reduce) {
				#lpq-loading::before,
				.lpq-loading-text,
				.lpq-loading-subtitle,
				.lpq-loading-progress-bar,
				.lpq-loading-ring > span {
					animation: none !important;
				}
				.lpq-loading-text,
				.lpq-loading-subtitle {
					opacity: 0.85;
				}
			}
		</style>
	</head>
	<body>
		<!-- Inline loading shell — visible before React hydrates -->
		<div id="lpq-loading">
			<div class="lpq-loading-ring"><span></span><span></span></div>
			<div class="lpq-loading-text">LPQ Al-Muhajirun</div>
			<div class="lpq-loading-subtitle">Metode Qiroati</div>
			<div class="lpq-loading-progress">
				<div class="lpq-loading-progress-bar"></div>
			</div>
		</div>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
